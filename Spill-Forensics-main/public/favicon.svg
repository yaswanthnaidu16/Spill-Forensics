<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark ocean background -->
  <circle cx="32" cy="32" r="32" fill="#020b14"/>
  
  <!-- Outer ring glow -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#19c3ef" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Mid ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#19c3ef" stroke-width="1" opacity="0.25"/>
  
  <!-- Spill zone circle (red) -->
  <circle cx="32" cy="32" r="8" fill="#ff5757" opacity="0.85"/>
  
  <!-- Center dot (source) -->
  <circle cx="32" cy="32" r="3" fill="#fff"/>
  
  <!-- Radiating lines (detection beams) -->
  <line x1="32" y1="10" x2="32" y2="18" stroke="#19c3ef" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="32" y2="54" stroke="#19c3ef" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="18" y2="32" stroke="#19c3ef" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="32" x2="54" y2="32" stroke="#19c3ef" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Diagonal beams -->
  <line x1="16" y1="16" x2="22" y2="22" stroke="#087da6" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="42" y1="42" x2="48" y2="48" stroke="#087da6" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="48" y1="16" x2="42" y2="22" stroke="#087da6" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="16" y1="48" x2="22" y2="42" stroke="#087da6" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
</svg>